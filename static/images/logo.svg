<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA357;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A9C937;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle/Shield Element -->
  <circle cx="250" cy="250" r="200" fill="url(#grad1)" opacity="0.1" />
  
  <!-- Main Shield Shape -->
  <path d="M250 50 C 150 50, 100 150, 100 250 C 100 380, 250 450, 250 450 C 250 450, 400 380, 400 250 C 400 150, 350 50, 250 50 Z" 
        fill="url(#grad1)" stroke="#606AAC" stroke-width="10" />
        
  <!-- Medical Cross / Document Symbol -->
  <rect x="225" y="120" width="50" height="260" rx="10" fill="#ffffff" />
  <rect x="120" y="225" width="260" height="50" rx="10" fill="#ffffff" />
  
  <!-- GeSRU Text (Stylized) -->
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#606AAC" text-anchor="middle" letter-spacing="5">GeSRU</text>
</svg>
